<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strongbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="crt" aria-hidden="true"></div>

    <main class="terminal">
      <div class="titlebar">
        <span class="dot dot--red"></span>
        <span class="dot dot--yellow"></span>
        <span class="dot dot--green"></span>
        <span class="titlebar-name">strongbox.sh</span>
      </div>

      <div class="screen" id="screen">
        <p class="line line--intro">
          <span class="prompt">$</span> <span id="typed"></span><span class="caret">_</span>
        </p>

        <div class="line line--field">
          <label class="prompt" for="password">password:</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              autocomplete="new-password"
              spellcheck="false"
            />
            <button type="button" class="toggle-btn" id="toggle-btn" aria-label="Show password">
              [ show ]
            </button>
          </div>
          <div class="utility-row">
            <button type="button" class="ghost-btn" id="generate-btn">[ generate ]</button>
            <button type="button" class="ghost-btn" id="copy-btn">
              <span id="copy-label">[ copy ]</span>
            </button>
          </div>
        </div>

        <p class="line">
          <span class="prompt">&gt;</span> strength: <span id="meter-blocks" class="blocks"></span>
          <span id="meter-label" class="meter-label">idle</span>
        </p>

        <ul class="requirements" id="requirements">
          <li data-req="length"><span class="box">[ ]</span> 8+ characters</li>
          <li data-req="lowercase"><span class="box">[ ]</span> lowercase</li>
          <li data-req="uppercase"><span class="box">[ ]</span> uppercase</li>
          <li data-req="number"><span class="box">[ ]</span> number</li>
          <li data-req="special"><span class="box">[ ]</span> special char</li>
        </ul>

        <div class="line line--field">
          <label class="prompt" for="confirm">confirm:</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirm"
              autocomplete="new-password"
              spellcheck="false"
            />
            <button
              type="button"
              class="toggle-btn"
              id="toggle-confirm-btn"
              aria-label="Show confirm password"
            >
              [ show ]
            </button>
          </div>
          <p class="match-hint" id="match-hint" aria-live="polite"></p>
        </div>

        <button type="button" class="btn-continue" id="set-btn">[ set password ]</button>
        <button type="button" class="ghost-btn btn-reset" id="reset-btn" hidden>
          [ reset ]
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
