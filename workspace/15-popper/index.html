<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <main class="stage">
      <div class="card" id="form-card">
        <span class="badge">🎟️ Early access</span>
        <h1>Claim your spot</h1>
        <p class="lede">Be first in line when we open the doors. No spam, just the good stuff.</p>

        <form id="signup-form">
          <input type="email" id="email" placeholder="you@example.com" required />
          <button type="submit">Reserve my seat</button>
        </form>
      </div>

      <div class="card card--success" id="success-card" hidden>
        <div class="success-icon">🎉</div>
        <h1>You're on the list!</h1>
        <p class="lede">We'll email you the moment it's your turn.</p>
        <button type="button" class="btn-ghost" id="reset-btn">Add another</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
