<!DOCTYPE html>
<html lang="en">
  <head>
  <base href="/demo/08-stray/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stray — 404</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <div class="glow" aria-hidden="true"></div>

      <p class="eyebrow">Error 404</p>

      <div class="digits" id="digits">
        <div class="digit digit--a" data-digit style="--hue: 18;">4</div>
        <div class="digit digit--b" data-digit style="--hue: 262;">0</div>
        <div class="digit digit--c" data-digit style="--hue: 172;">4</div>
      </div>

      <p class="hint">(they're draggable — go on, fling one)</p>

      <h1>This page wandered off.</h1>
      <p class="lede">
        Whatever you were looking for isn't here. Let's get you back to solid ground.
      </p>

      <a href="/" class="btn-home">
        <span>Take me home</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
      </a>
    </main>

    <script src="script.js"></script>
  </body>
</html>
